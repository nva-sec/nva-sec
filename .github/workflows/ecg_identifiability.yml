name: ECG Identifiability Audit

on:
  workflow_dispatch:
  push:
    paths:
      - analysis/ecg_identifiability_audit.py.gz.b64
      - .github/workflows/ecg_identifiability.yml

permissions:
  contents: write

concurrency:
  group: ecg-identifiability-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out analysis repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install scientific Python stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy<3' 'pandas<3' 'scipy<2' 'scikit-learn<2' 'matplotlib<4'

      - name: Decode analysis source
        run: |
          base64 -d analysis/ecg_identifiability_audit.py.gz.b64 > /tmp/ecg_identifiability_audit.py.gz
          gzip -dc /tmp/ecg_identifiability_audit.py.gz > analysis/ecg_identifiability_audit.py
          python -m py_compile analysis/ecg_identifiability_audit.py

      - name: Fetch the public paired ECG dataset
        run: |
          git clone --depth 1 https://github.com/akbilgic/SJLIFE-Paired-Clinical-and-Apple-Watch-ECG-Repository.git source_data

      - name: Run the preregistered audit
        id: audit
        shell: bash
        run: |
          mkdir -p results
          git -C source_data rev-parse HEAD > results/source_commit.txt
          cp analysis/ecg_identifiability_audit.py results/
          set +e
          python analysis/ecg_identifiability_audit.py \
            --data-root source_data \
            --out results \
            --repeats 40 2>&1 | tee results/console_summary.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "$code" > results/exit_code.txt
          if [ "$code" -eq 0 ]; then echo SUCCESS > results/STATUS.txt; else echo FAILURE > results/STATUS.txt; fi
          python -m pip freeze > results/environment.txt

      - name: Export the strongest waveform counterexample
        if: always()
        shell: bash
        run: |
          if [ -f results/summary.json ]; then
            PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from analysis.ecg_identifiability_audit import median_beat, normalize_template, PRE_SEC, POST_SEC, TARGET_POINTS, LEADS

          out = Path('results')
          summary = json.loads((out / 'summary.json').read_text())
          ex = summary.get('ambiguity', {}).get('example')
          if ex:
              ids = [int(ex['id_a']), int(ex['id_b'])]
              rows = {'time_sec': np.linspace(-PRE_SEC, POST_SEC, TARGET_POINTS, endpoint=False)}
              for sid in ids:
                  arr = np.load(f'source_data/ClinicalECGs_full_243/clinical_ecg_{sid}.npy', allow_pickle=False).squeeze()
                  if arr.shape[0] != 12 and arr.shape[1] == 12:
                      arr = arr.T
                  beat, _, _, _ = median_beat(arr, arr.shape[1] / 10.0)
                  rows[f'id_{sid}_LeadI_normalized'] = normalize_template(beat[0])[0]
                  for idx in [6, 8, 10]:
                      rows[f'id_{sid}_{LEADS[idx]}'] = beat[idx]
              pd.DataFrame(rows).to_csv(out / 'doppelganger_waveforms.csv', index=False)
          PY
          fi

      - name: Create checksums
        if: always()
        shell: bash
        run: |
          (cd results && find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Publish machine-readable temporary results
        if: always()
        shell: bash
        run: |
          rm -rf TEMP_ECG_RESULTS
          mkdir -p TEMP_ECG_RESULTS
          for f in results/*.json results/*.csv results/*.md results/*.txt; do
            [ -e "$f" ] && cp "$f" TEMP_ECG_RESULTS/
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f TEMP_ECG_RESULTS
          git commit -m 'Publish temporary ECG audit results' || true
          git push origin HEAD:main

      - name: Upload auditable result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecg-identifiability-results
          path: results
          if-no-files-found: warn
          retention-days: 7
