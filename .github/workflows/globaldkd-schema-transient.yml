name: Transient GlobalDKD Australian discovery

on:
  push:
    branches:
      - transient/globaldkd-schema-20260805
    paths-ignore:
      - '.github/workflows/promote-globaldkd-discovery.yml'
      - 'transient-globaldkd/frozen-discovery/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/promote-globaldkd-discovery.yml'
      - 'transient-globaldkd/frozen-discovery/**'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  australian-discovery:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned discovery dependencies
        run: python -m pip install --disable-pip-version-check -r transient-globaldkd/requirements-discovery.txt

      - name: Download and verify versioned public archive
        run: |
          mkdir -p transient-globaldkd/data
          curl --fail --location \
            --retry 10 --retry-all-errors --retry-delay 15 \
            'https://zenodo.org/records/14762603/files/GlobalDKD.zip?download=1' \
            --output transient-globaldkd/data/GlobalDKD.zip
          echo '8d5d4ba0e0578d0e39e76e1f1514a841  transient-globaldkd/data/GlobalDKD.zip' | md5sum --check --strict

      - name: Run Australian-only exhaustive discovery
        run: |
          python transient-globaldkd/discover_windows.py \
            transient-globaldkd/data/GlobalDKD.zip \
            transient-globaldkd/outputs/discovery \
            transient-globaldkd/PREREGISTRATION.md

      - name: Print discovery summary and frozen digests
        if: always()
        run: |
          if [ -f transient-globaldkd/outputs/discovery/discovery-summary.json ]; then
            cat transient-globaldkd/outputs/discovery/discovery-summary.json
          fi
          if [ -f transient-globaldkd/outputs/discovery/frozen-discovery.sha256 ]; then
            cat transient-globaldkd/outputs/discovery/frozen-discovery.sha256
          fi
          if [ -f transient-globaldkd/outputs/discovery/fold-manifest.sha256 ]; then
            cat transient-globaldkd/outputs/discovery/fold-manifest.sha256
          fi

      - name: Upload frozen Australian discovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: globaldkd-australian-discovery
          path: transient-globaldkd/outputs/discovery/
          if-no-files-found: warn
          retention-days: 7
