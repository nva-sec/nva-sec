name: Transient GlobalDKD schema audit

on:
  push:
    branches:
      - transient/globaldkd-schema-20260805
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  schema-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install schema-audit dependencies
        run: python -m pip install --disable-pip-version-check -r transient-globaldkd/requirements-schema.txt

      - name: Download versioned public archive
        run: |
          mkdir -p transient-globaldkd/data
          curl --fail --location \
            --retry 10 --retry-all-errors --retry-delay 15 \
            'https://zenodo.org/records/14762603/files/GlobalDKD.zip?download=1' \
            --output transient-globaldkd/data/GlobalDKD.zip
          echo '8d5d4ba0e0578d0e39e76e1f1514a841  transient-globaldkd/data/GlobalDKD.zip' | md5sum --check --strict

      - name: Audit archive schema and donor inventory only
        run: |
          python transient-globaldkd/schema_audit.py \
            transient-globaldkd/data/GlobalDKD.zip \
            transient-globaldkd/outputs/schema-audit

      - name: Print schema-only artifact for review
        if: always()
        run: |
          if [ -f transient-globaldkd/outputs/schema-audit/README.md ]; then
            cat transient-globaldkd/outputs/schema-audit/README.md
          fi
          if [ -f transient-globaldkd/outputs/schema-audit/schema-audit.json ]; then
            cat transient-globaldkd/outputs/schema-audit/schema-audit.json
          fi

      - name: Upload schema audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: globaldkd-schema-audit
          path: transient-globaldkd/outputs/schema-audit/
          if-no-files-found: warn
          retention-days: 7
