name: Read-only lookup of GlobalDKD one-shot run

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query exact sentinel head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            '/repos/nva-sec/nva-sec/actions/runs?head_sha=bc45a8092114af4a46d95fc03e8314926f92636d&per_page=100' \
            > runs.json
          jq '{total_count, workflow_runs: [.workflow_runs[] | {id,name,event,status,conclusion,head_sha,jobs_url,artifacts_url,html_url}]}' runs.json
          test "$(jq '.total_count' runs.json)" -ge 1
      - name: Upload lookup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: globaldkd-run-lookup
          path: runs.json
          if-no-files-found: warn
          retention-days: 1
